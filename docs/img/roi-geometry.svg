<svg xmlns="http://www.w3.org/2000/svg" width="960" height="352" viewBox="0 0 960 352" role="img" aria-label="Three synthetic runners at increasing lean. The same four keypoints bound a torso rectangle in each; the rectangle rotates with the shoulder-to-hip line and still contains the bib.">
<style>
  .roi { fill: #f59e0b; fill-opacity: 0.12; stroke: #b45309; stroke-width: 1.5; }
  .skeleton polyline { fill: none; stroke: #1f2937; stroke-width: 2; stroke-linecap: round; }
  .furniture polyline, .furniture circle { fill: none; stroke: #9aa4b2; stroke-width: 2; stroke-linecap: round; }
  .bib { fill: #111827; }
  .bibtext { fill: #ffffff; font: 600 7.5px ui-monospace, Menlo, monospace;
             letter-spacing: 0.08em; text-anchor: middle; }
  .anchors circle { fill: #1f2937; }
  .cap { fill: #111827; font: 500 11px ui-monospace, Menlo, monospace; letter-spacing: 0.09em; }
  .sub { fill: #6b7280; font: 10px ui-monospace, Menlo, monospace; letter-spacing: 0.04em; }
  .foot { fill: #6b7280; font: 10px ui-monospace, Menlo, monospace; letter-spacing: 0.03em; }
</style>
<rect width="960" height="352" fill="#ffffff" />
<g data-angle="0.00" data-roi-w="80.60" data-roi-h="135.70"><polygon class="roi" points="119.7,56.3 200.3,56.3 200.3,192.0 119.7,192.0" /><g class="furniture"><polyline points="141.4,192.0 128.4,238.0 121.4,276.0" /><polyline points="178.6,192.0 191.6,238.0 198.6,276.0" /><polyline points="160.0,74.0 160.0,38.3" /><circle cx="160.0" cy="38.3" r="14" /></g><polygon class="bib" points="135.0,96.5 185.0,96.5 185.0,131.8 135.0,131.8" /><text class="bibtext" transform="rotate(0.00 160.0 114.1)" x="160.0" y="116.7">A0030</text><g class="skeleton"><polyline points="129.0,74.0 191.0,74.0" /><polyline points="141.4,192.0 178.6,192.0" /><polyline points="129.0,74.0 141.4,192.0" /><polyline points="191.0,74.0 178.6,192.0" /></g><g class="anchors"><circle cx="129.0" cy="74.0" r="3.4" /><circle cx="191.0" cy="74.0" r="3.4" /><circle cx="141.4" cy="192.0" r="3.4" /><circle cx="178.6" cy="192.0" r="3.4" /></g><text class="cap" x="160" y="298" text-anchor="middle">upright</text><text class="sub" x="160" y="315" text-anchor="middle">ROI 0°</text></g><g data-angle="14.00" data-roi-w="80.60" data-roi-h="135.70"><polygon class="roi" points="436.6,66.6 514.8,47.1 547.6,178.7 469.4,198.2" /><g class="furniture"><polyline points="490.5,193.0 477.5,239.0 470.5,277.0" /><polyline points="526.6,184.0 539.6,230.0 546.6,268.0" /><polyline points="480.0,74.0 471.4,39.4" /><circle cx="471.4" cy="39.4" r="14" /></g><polygon class="bib" points="461.2,101.9 509.7,89.8 518.2,124.0 469.7,136.1" /><text class="bibtext" transform="rotate(14.00 489.7 112.9)" x="489.7" y="115.5">A0030</text><g class="skeleton"><polyline points="449.9,81.5 510.1,66.5" /><polyline points="490.5,193.0 526.6,184.0" /><polyline points="449.9,81.5 490.5,193.0" /><polyline points="510.1,66.5 526.6,184.0" /></g><g class="anchors"><circle cx="449.9" cy="81.5" r="3.4" /><circle cx="510.1" cy="66.5" r="3.4" /><circle cx="490.5" cy="193.0" r="3.4" /><circle cx="526.6" cy="184.0" r="3.4" /></g><text class="cap" x="480" y="298" text-anchor="middle">mid-stride</text><text class="sub" x="480" y="315" text-anchor="middle">ROI 14°</text></g><g data-angle="27.00" data-roi-w="80.60" data-roi-h="135.70"><polygon class="roi" points="756.1,76.5 827.9,39.9 889.5,160.8 817.7,197.4" /><g class="furniture"><polyline points="837.0,187.6 824.0,233.6 817.0,271.6" /><polyline points="870.1,170.7 883.1,216.7 890.1,254.7" /><polyline points="800.0,74.0 783.8,42.2" /><circle cx="783.8" cy="42.2" r="14" /></g><polygon class="bib" points="787.9,105.4 832.5,82.7 848.5,114.1 804.0,136.8" /><text class="bibtext" transform="rotate(27.00 818.2 109.7)" x="818.2" y="112.3">A0030</text><g class="skeleton"><polyline points="772.4,88.1 827.6,59.9" /><polyline points="837.0,187.6 870.1,170.7" /><polyline points="772.4,88.1 837.0,187.6" /><polyline points="827.6,59.9 870.1,170.7" /></g><g class="anchors"><circle cx="772.4" cy="88.1" r="3.4" /><circle cx="827.6" cy="59.9" r="3.4" /><circle cx="837.0" cy="187.6" r="3.4" /><circle cx="870.1" cy="170.7" r="3.4" /></g><text class="cap" x="800" y="298" text-anchor="middle">into the tape</text><text class="sub" x="800" y="315" text-anchor="middle">ROI 27°</text></g>
<text class="foot" x="160" y="342" text-anchor="middle">amber = torso ROI, computed from the four anchors</text>
<text class="foot" x="480" y="342" text-anchor="middle">black = the bib it has to contain</text>
<text class="foot" x="800" y="342" text-anchor="middle">nothing here was trained on a bib</text>
</svg>
